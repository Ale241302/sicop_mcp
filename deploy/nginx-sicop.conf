# Nginx para sicop.vlinte.work (API + Atlas + MCP remoto)
# sicop_mcp escucha en 127.0.0.1:8400 (django) y 127.0.0.1:8450 (MCP streamable-http)
server {
    listen 80;
    server_name sicop.vlinte.work;

    client_max_body_size 50m;

    # ---- MCP remoto (Claude.ai / cualquier cliente) ----
    location /mcp {
        proxy_pass http://172.17.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                 # SSE
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- API REST + Atlas ----
    location / {
        proxy_pass http://172.17.0.1:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}

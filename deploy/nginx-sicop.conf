# Nginx para sicop.vlinte.work
# Añadir este server block al nginx compartido del VPS (mwt-nginx, puertos 80/443)
# NO colisiona: sicop_mcp escucha en 127.0.0.1:8400 (no toca 80/443 de los demás).
#
# Instalación en el VPS (el nginx compartido suele estar en /opt/mwt/nginx/conf.d/):
#   sudo tee /opt/mwt/nginx/conf.d/sicop.conf > /dev/null <<'EOF'
#   <contenido de este archivo>
#   EOF
#   docker exec mwt-nginx nginx -t && docker exec mwt-nginx nginx -s reload

server {
    listen 80;
    server_name sicop.vlinte.work;

    # fuerza HTTPS (cert bot de Cloudflare en modo flexible o certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sicop.vlinte.work;

    # Si usas certbot en el VPS:
    # ssl_certificate     /etc/letsencrypt/live/sicop.vlinte.work/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sicop.vlinte.work/privkey.pem;
    # Si usas Cloudflare Flexible (solo-http al origen), puedes omitir este bloque 443
    # y dejar solo el 80 proxy. Recomendado: Cloudflare Full (strict) + certbot.

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}


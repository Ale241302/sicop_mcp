services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sicop
      POSTGRES_USER: sicop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicop_dev_2026}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  django:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - .:/app
      - ${SICOP_DATA_DIR:-/opt/sicop_data/Salidas}:/data/salidas
      - ${SICOP_SCRIPTS_DIR:-/opt/sicop_data/scripts}:/data/scripts
      - ${SICOP_RECOVERY_DIR:-/opt/sicop_data/recuperacion}:/data/recuperacion
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,sicop.vlinte.work,django
      POSTGRES_DB: sicop
      POSTGRES_USER: sicop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicop_dev_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SICOP_DATA_DIR: /data/salidas
      SICOP_SCRIPTS_DIR: /data/scripts
      SICOP_RECOVERY_DIR: /data/recuperacion
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8400:8000"

  celery-worker:
    build: .
    command: celery -A config worker -l info --concurrency=4
    volumes:
      - .:/app
      - ${SICOP_DATA_DIR:-/opt/sicop_data/Salidas}:/data/salidas
      - ${SICOP_SCRIPTS_DIR:-/opt/sicop_data/scripts}:/data/scripts
      - ${SICOP_RECOVERY_DIR:-/opt/sicop_data/recuperacion}:/data/recuperacion
    environment:
      POSTGRES_DB: sicop
      POSTGRES_USER: sicop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicop_dev_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SICOP_DATA_DIR: /data/salidas
      SICOP_SCRIPTS_DIR: /data/scripts
      SICOP_RECOVERY_DIR: /data/recuperacion
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  mcp:
    build: .
    command: python -m sicop.mcp_server streamable-http --host 0.0.0.0 --port 9000 --path /mcp
    volumes:
      - .:/app
      - ${SICOP_DATA_DIR:-/opt/sicop_data/Salidas}:/data/salidas
      - ${SICOP_SCRIPTS_DIR:-/opt/sicop_data/scripts}:/data/scripts
      - ${SICOP_RECOVERY_DIR:-/opt/sicop_data/recuperacion}:/data/recuperacion
    environment:
      POSTGRES_DB: sicop
      POSTGRES_USER: sicop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicop_dev_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SICOP_DATA_DIR: /data/salidas
      SICOP_SCRIPTS_DIR: /data/scripts
      SICOP_RECOVERY_DIR: /data/recuperacion
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8450:9000"

volumes:
  pgdata:
